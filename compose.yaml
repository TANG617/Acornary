name: acornary
services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: acornary
      POSTGRES_DB: acornary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/local.mjs init first}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U acornary -d acornary']
      interval: 3s
      timeout: 3s
      retries: 30
  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgres://acornary:${POSTGRES_PASSWORD}@postgres:5432/acornary
      HOUSEHOLD_TIMEZONE: ${HOUSEHOLD_TIMEZONE:-Asia/Shanghai}
    ports:
      - '127.0.0.1:${ACORNARY_PORT:-3210}:3210'
    volumes:
      - ./.local/token:/run/acornary/token:ro
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
