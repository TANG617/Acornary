name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Deployment controller tests
        run: python3 -m unittest discover -s tests/deploy -v
      - name: Build isolated test runtime
        run: docker build --target browser-test -t acornary-ci .
      - name: Types, PostgreSQL, OAuth, build and browser tests
        run: node scripts/ci.mjs
      - name: Build release recovery fixture
        run: docker build --target runtime -t acornary-release-fixture:base --build-arg VERSION=v9.0.0 --build-arg COMMIT=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa .
      - name: Real PostgreSQL migration and application recovery
        run: python3 tests/deploy/real_containers.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: ci-browser-results
          path: output/ci/
          retention-days: 7
          if-no-files-found: ignore
